data:
  ticker: ACB
  offline: true
  horizon: 5
  sequence_length: 20
  features:
    - return_1d
    - return_5d
    - return_10d
    - return_20d
    - close_to_ma_5
    - close_to_ma_10
    - close_to_ma_20
    - close_to_ma_50
    - rolling_volatility_5
    - rolling_volatility_20
    - volume_change
    - volume_to_ma_20
    - high_low_range
    - open_close_range
split:
  test: 0.15
  n_splits: 5
  test_size: 125
  gap: 5
warning:
  q_warning: 0.5
  q_high: 0.7
alert_policy:
  # Validation calibration limits; the selector favors recall within these limits.
  max_alert_rate: 0.15
  min_precision: 0.25
  model_overrides:
    xgboost:
      # HIGH-focused experiment; inspect false alerts as well as recall.
      max_alert_rate: 0.30
lstm_walk_forward:
  max_alert_rate: 0.30  # validation budget for HIGH-focused LSTM only
  min_precision: 0.25
  fallback_to_budget: true  # still emit budgeted alerts if precision is unattainable
seed: 42
models:
  garch:
    mean: Zero
    distribution: normal
  xgboost:
    n_estimators: 160
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    reg_lambda: 1.0
    # Giữ estimator một luồng; song song hóa ở tầng GridSearchCV.
    n_jobs: 1
    tuning:
      search_n_jobs: 2
      # Favor HIGH ranking while allowing at most 5% more CV RMSE than the
      # most accurate candidate. The small-tree baseline stays in the search.
      rmse_tolerance: 0.05
      param_grid:
        - n_estimators: [5]
          max_depth: [3]
          learning_rate: [0.11]
          subsample: [0.4, 0.5, 0.65]
          colsample_bytree: [0.3]
        - n_estimators: [50, 150, 300]
          max_depth: [2, 3]
          learning_rate: [0.03, 0.1]
          subsample: [0.8]
          colsample_bytree: [0.8]
      fast_param_grid:
        n_estimators: [3]
        max_depth: [1, 2]
        learning_rate: [0.05]
        subsample: [0.5]
        colsample_bytree: [0.2]
  lstm:
    hidden_size: 32
    epochs: 500
    patience: 5
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 0.0001
    high_loss_weight: 0.0  # opt-in HIGH head; walk-forward search tests positive weights
paths:
  raw: data/raw
  processed: data/processed
  artifacts: artifacts
